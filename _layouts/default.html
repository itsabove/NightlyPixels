<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta https-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/print.css' | relative_url }}" media="print">
    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

{% seo %}
    {% include head-custom.html %}
  </head>

  <body class="{% if page.full_width %}full-width-page{% endif %}">
    <div id="container">
      <div class="inner">

  <header style="text-align: center; position: sticky; top: 0; z-index: 1000; background-color: #ffffff; padding: 10px 0;">
  {% if site.logo %}
    <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo" style="max-width: 100px; height: auto;" />
  {% endif %}
  <nav class="ign-navbar">
  <div class="ign-nav-inner">
    <div class="ign-nav-left">
      <a href="{{ '/' | relative_url }}" class="ign-logo">
        <!-- Replace with your <img> tag or site title -->
        YOUR SITE
      </a>
      <ul class="ign-links">
        <li><a href="/pages/Reviews">Reviews</a></li>
        <li><a href="/pages/Previews">Previews</a></li>
        <li><a href="/pages/Features">Features</a></li>
        <li><a href="/pages/list">List</a></li>
      </ul>
    </div>
    
    <div class="ign-nav-right">
      <a href="/search" class="ign-search-btn" aria-label="Search">🔍</a>
      <button class="ign-hamburger" aria-label="Menu">☰</button>
    </div>
  </div>
</nav>

  </header>
      

        <hr>
        <section id="main_content">
          {{ content }}
        </section>

        <footer class="site-footer">
  <!-- Left Side -->
  <div class="footer-left">
    <p>Copyright © 2026</p>
  </div>

  <!-- Right Side -->
  <div class="footer-right">
    <span><a href="/about">About Us</a></span>
    <br>
    <span>Built with Passion by<a href="https://6af7a66789893ca61a9aff38.imgix.net/writer.png"> Me!</a></span>
  </div>
        </footer>

      </div>
    </div>
  </body>
</html>
