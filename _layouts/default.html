<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta https-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
    <link rel="stylesheet" type="text/css" href="{{ '/assets/css/print.css' | relative_url }}" media="print">
    <!--[if lt IE 9]>
    <script src="//html5shiv.googlecode.com/svn/trunk/html5.js"></script>
    <![endif]-->

{% seo %}
    {% include head-custom.html %}
  </head>

  <body>
    <div id="container">
      <div class="inner">

<header style="text-align: center;">
  {% if site.logo %}
    <img src="{{ site.logo | relative_url }}" alt="{{ site.title }} logo" style="max-width: 150px; height: auto;" />
  {% endif %}
            
  <nav style="display: flex; flex-direction: column; align-items: center; margin-top: 15px;">
    <ul style="list-style: none; list-style-image: none; display: flex; flex-direction: row; flex-wrap: wrap; justify-content: center; gap: 20px; margin: 0; padding: 10px 0;">
      <li style="list-style: none; list-style-image: none; padding-left: 0;"><a href="{{ '/' | relative_url }}" style="font-weight: bold; text-decoration: none; color: #303030;">Home</a></li>
      <li style="list-style: none; list-style-image: none; padding-left: 0;"><a href="{{ '/pages/Reviews' | relative_url }}" style="font-weight: bold; text-decoration: none; color: #303030;">Reviews</a></li>
      <li style="list-style: none; list-style-image: none; padding-left: 0;"><a href="{{ '/pages/Previews' | relative_url }}" style="font-weight: bold; text-decoration: none; color: #303030;">Previews</a></li>
      <li style="list-style: none; list-style-image: none; padding-left: 0;"><a href="{{ '/pages/Features'| relative_url }}" style="font-weight: bold; text-decoration: none; color: #303030;">Features</a></li>
    </ul>
  </nav>
</header>


        <hr>
        <section id="main_content">
          {{ content }}
        </section>

        <footer>
      
        </footer>

      </div>
    </div>
  </body>
</html>
